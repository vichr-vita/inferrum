<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Inferrum ruleset</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; background: #000; color: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1580px; margin: auto; padding: 24px clamp(16px, 3vw, 48px) 48px; }
    h1 { font-size: 25px; letter-spacing: -.6px; font-weight: 600; margin: 0; }
    h2 { font-size: 20px; margin: 0; overflow-wrap: anywhere; }
    h3 { font-size: 14px; margin: 24px 0 10px; }
    p { margin: 8px 0 16px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid #555; padding-bottom: 20px; }
    .brand { font-size: 15px; margin: 0; }
    .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; align-items: end; gap: 16px 24px; margin: 20px 0; }
    label { display: block; font-size: 13px; margin-bottom: 6px; }
    select, button { font: inherit; color: inherit; background: #000; border: 1px solid #666; border-radius: 0; min-height: 44px; max-width: 100%; }
    select { width: 100%; padding: 8px 32px 8px 10px; text-overflow: ellipsis; }
    button { cursor: pointer; padding: 8px 12px; }
    button:disabled { color: #999; cursor: default; }
    a { color: #74dfd0; overflow-wrap: anywhere; text-underline-offset: 4px; }
    :focus-visible { outline: 2px solid #74dfd0; outline-offset: 3px; }
    .summary { display: flex; flex-wrap: wrap; gap: 6px 24px; padding: 12px 0; margin-bottom: 22px; border-block: 1px solid #333; font-size: 13px; }
    #case-caption { overflow-wrap: anywhere; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 330px); gap: 28px; align-items: start; }
    .workspace > *, .toolbar > * { min-width: 0; }
    #diagram { width: 100%; display: block; height: auto; }
    #diagram .rule-node rect { fill: #000; stroke: #888; stroke-width: 1.4; }
    #diagram .rule-node text { fill: #fff; text-anchor: middle; font: 14px Arial, sans-serif; }
    #diagram .rule-node .node-value { font-size: 13px; }
    #diagram .rule-node[aria-current="true"] rect { stroke: #74dfd0; stroke-width: 2.5; }
    #diagram .rule-node[aria-current="true"] text { fill: #74dfd0; }
    #diagram .rule-node[data-status="skipped"] rect { stroke-dasharray: 5 4; }
    #diagram .rule-node[data-status="no_match"] .node-value, #diagram .rule-node[data-status="skipped"] .node-value { fill: #f0b36c; }
    #diagram .edge { fill: none; stroke: #777; stroke-width: 1.25; }
    #diagram .edge.selected { stroke: #74dfd0; stroke-width: 2; }
    #diagram .rule-node:focus { outline: none; }
    #diagram .rule-node:focus rect { stroke: #fff; stroke-width: 3; }
    #inspector { border-left: 1px solid #555; padding-left: 22px; padding-right: 6px; position: sticky; top: 16px; max-height: calc(100dvh - 32px); overflow-y: auto; scrollbar-width: thin; }
    #inspector h2 { color: #74dfd0; }
    #rule-requirement { margin-top: 16px; }
    .status { font-size: 13px; margin: 8px 0 0; }
    .status[data-kind="skipped"], .status[data-kind="no_match"] { color: #f0b36c; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
    .facts { list-style: none; padding: 0; margin: 0; }
    .facts li { padding: 10px 0; border-bottom: 1px solid #333; }
    .fact-name { display: block; }
    .fact-type { font-size: 11px; color: #ccc; overflow-wrap: anywhere; }
    .fact-value { display: block; margin-top: 6px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    #outputs .fact-value { font-size: 26px; letter-spacing: -.5px; }
    .fact-origin { display: inline-block; font-size: 12px; margin-top: 6px; }
    details { margin-top: 22px; border-block: 1px solid #444; }
    summary { cursor: pointer; min-height: 44px; padding: 10px 0; }
    pre { margin: 0 0 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 12px; margin: 16px 0; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .box { width: 13px; height: 11px; border: 1px solid #fff; }
    .dashed { border-style: dashed; }
    .note { font-size: 12px; margin-top: 22px; }
    #rule-list { list-style: none; padding: 0; margin: 0; display: none; }
    #rule-list li { border-bottom: 1px solid #444; padding: 12px 0; }
    #rule-list a { display: block; min-height: 44px; padding: 8px 0; }
    #rule-list a[aria-current="true"] { color: #74dfd0; font-weight: 600; }
    #rule-list a:not([aria-current="true"]) { color: #fff; }
    #rule-list p { font-size: 12px; margin: 4px 0; overflow-wrap: anywhere; }
    #empty { padding: 30px 0; }
    [hidden] { display: none !important; }
    @media (max-width: 1100px) { .workspace { grid-template-columns: minmax(0,1fr); } #inspector { border-left: 0; padding: 22px 0 0; border-top: 1px solid #555; position: static; max-height: none; overflow-y: visible; } }
    @media (max-width: 700px) {
      .toolbar { grid-template-columns: minmax(0,1fr); gap: 12px; }
      .toolbar button { justify-self: start; }
      #diagram, .legend { display: none; }
      #rule-list { display: block; }
      .workspace { display: flex; flex-direction: column; gap: 24px; }
      #inspector { order: -1; width: 100%; padding: 0 0 24px; border-top: 0; border-bottom: 1px solid #555; }
      #graph-region { width: 100%; }
      #outputs .fact-value { font-size: 24px; }
      .summary { margin-bottom: 20px; }
    }
  </style>
</head>

<script id="inferrum-data" type="application/json">{"title":"Synthetic annual bonus","inputCount":14,"rules":[{"id":"good_performance","requirement":"BR-01: Scores must be 0..100. A score above 50 passes.","source":"pub fn good_performance(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    let score = *i.get(PERFORMANCE)?;\u000a    if score \u003e 100 {\u000a        return Err(Error::Custom(\u000a            \"performance_score must be between 0 and 100\".into(),\u000a        ));\u000a    }\u000a    Facts::one(GOOD, score \u003e 50)\u000a}","inputs":[{"name":"performance_score","type":"u8"}],"outputs":[{"name":"good_performance","type":"bool"}]},{"id":"exceptional_performance","requirement":"BR-02: A score of at least 90 is exceptional.","source":"pub fn exceptional_performance(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(EXCEPTIONAL, *i.get(PERFORMANCE)? \u003e= 90)\u000a}","inputs":[{"name":"performance_score","type":"u8"}],"outputs":[{"name":"exceptional_performance","type":"bool"}]},{"id":"tenure_eligible","requirement":"BR-03: At least 12 months of service are required.","source":"pub fn tenure_eligible(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(TENURE_OK, *i.get(TENURE)? \u003e= 12)\u000a}","inputs":[{"name":"tenure_months","type":"u16"}],"outputs":[{"name":"tenure_eligible","type":"bool"}]},{"id":"conduct_clear","requirement":"BR-04: An active disciplinary hold blocks eligibility.","source":"pub fn conduct_clear(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(CONDUCT_OK, !*i.get(DISCIPLINARY)?)\u000a}","inputs":[{"name":"disciplinary_hold","type":"bool"}],"outputs":[{"name":"conduct_clear","type":"bool"}]},{"id":"employment_eligible","requirement":"BR-05: Employment must be active and tenure eligible.","source":"pub fn employment_eligible(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(EMPLOYMENT_OK, *i.get(ACTIVE)? \u0026\u0026 *i.get(TENURE_OK)?)\u000a}","inputs":[{"name":"active","type":"bool"},{"name":"tenure_eligible","type":"bool"}],"outputs":[{"name":"employment_eligible","type":"bool"}]},{"id":"bonus_eligible","requirement":"BR-06: Require eligible employment, good performance, clear conduct, and completed training.","source":"pub fn bonus_eligible(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        ELIGIBLE,\u000a        *i.get(EMPLOYMENT_OK)? \u0026\u0026 *i.get(GOOD)? \u0026\u0026 *i.get(CONDUCT_OK)? \u0026\u0026 *i.get(TRAINING)?,\u000a    )\u000a}","inputs":[{"name":"employment_eligible","type":"bool"},{"name":"good_performance","type":"bool"},{"name":"conduct_clear","type":"bool"},{"name":"training_complete","type":"bool"}],"outputs":[{"name":"bonus_eligible","type":"bool"}]},{"id":"role_rate","requirement":"BR-07: Base rates are 5% for clerks, 7% for specialists, and 8% for managers.","source":"pub fn role_rate(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        ROLE_RATE,\u000a        match i.get(ROLE)? {\u000a            Role::Clerk =\u003e 500,\u000a            Role::Specialist =\u003e 700,\u000a            Role::Manager =\u003e 800,\u000a        },\u000a    )\u000a}","inputs":[{"name":"role","type":"bonus::bonus::Role"}],"outputs":[{"name":"role_rate_bps","type":"u64"}]},{"id":"department_factor","requirement":"BR-08: Department factors are 110% engineering, 120% sales, and 100% operations.","source":"pub fn department_factor(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        DEPARTMENT_FACTOR,\u000a        match i.get(DEPARTMENT)? {\u000a            Department::Engineering =\u003e 11_000,\u000a            Department::Sales =\u003e 12_000,\u000a            Department::Operations =\u003e 10_000,\u000a        },\u000a    )\u000a}","inputs":[{"name":"department","type":"bonus::bonus::Department"}],"outputs":[{"name":"department_factor_bps","type":"u64"}]},{"id":"company_factor","requirement":"BR-09: Company factor is 100% when its target is met, otherwise 50%.","source":"pub fn company_factor(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        COMPANY_FACTOR,\u000a        if *i.get(TARGET_MET)? { 10_000 } else { 5_000 },\u000a    )\u000a}","inputs":[{"name":"company_target_met","type":"bool"}],"outputs":[{"name":"company_factor_bps","type":"u64"}]},{"id":"performance_factor","requirement":"BR-10: Exceptional performance multiplies the base by 150%, otherwise 100%.","source":"pub fn performance_factor(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        PERFORMANCE_FACTOR,\u000a        if *i.get(EXCEPTIONAL)? { 15_000 } else { 10_000 },\u000a    )\u000a}","inputs":[{"name":"exceptional_performance","type":"bool"}],"outputs":[{"name":"performance_factor_bps","type":"u64"}]},{"id":"base_bonus","requirement":"BR-11: Multiply annual salary by the role rate.","source":"pub fn base_bonus(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(BASE, scaled(*i.get(SALARY)?, *i.get(ROLE_RATE)?)?)\u000a}","inputs":[{"name":"salary_cents","type":"u64"},{"name":"role_rate_bps","type":"u64"}],"outputs":[{"name":"base_bonus_cents","type":"u64"}]},{"id":"performance_bonus","requirement":"BR-12: Apply the performance factor to the base bonus.","source":"pub fn performance_bonus(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        PERFORMANCE_BONUS,\u000a        scaled(*i.get(BASE)?, *i.get(PERFORMANCE_FACTOR)?)?,\u000a    )\u000a}","inputs":[{"name":"base_bonus_cents","type":"u64"},{"name":"performance_factor_bps","type":"u64"}],"outputs":[{"name":"performance_bonus_cents","type":"u64"}]},{"id":"department_bonus","requirement":"BR-13: Apply the department factor after performance.","source":"pub fn department_bonus(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        DEPARTMENT_BONUS,\u000a        scaled(*i.get(PERFORMANCE_BONUS)?, *i.get(DEPARTMENT_FACTOR)?)?,\u000a    )\u000a}","inputs":[{"name":"performance_bonus_cents","type":"u64"},{"name":"department_factor_bps","type":"u64"}],"outputs":[{"name":"department_bonus_cents","type":"u64"}]},{"id":"company_bonus","requirement":"BR-14: Apply the company factor after the department factor.","source":"pub fn company_bonus(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        COMPANY_BONUS,\u000a        scaled(*i.get(DEPARTMENT_BONUS)?, *i.get(COMPANY_FACTOR)?)?,\u000a    )\u000a}","inputs":[{"name":"department_bonus_cents","type":"u64"},{"name":"company_factor_bps","type":"u64"}],"outputs":[{"name":"company_bonus_cents","type":"u64"}]},{"id":"tenure_award","requirement":"BR-15: Add 50,000 cents for at least 36 months of service.","source":"pub fn tenure_award(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(TENURE_AWARD, if *i.get(TENURE)? \u003e= 36 { 50_000 } else { 0 })\u000a}","inputs":[{"name":"tenure_months","type":"u16"}],"outputs":[{"name":"tenure_award_cents","type":"u64"}]},{"id":"retention_award","requirement":"BR-16: Add 75,000 cents for critical skills with good performance.","source":"pub fn retention_award(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        RETENTION_AWARD,\u000a        if *i.get(CRITICAL_SKILL)? \u0026\u0026 *i.get(GOOD)? {\u000a            75_000\u000a        } else {\u000a            0\u000a        },\u000a    )\u000a}","inputs":[{"name":"critical_skill","type":"bool"},{"name":"good_performance","type":"bool"}],"outputs":[{"name":"retention_award_cents","type":"u64"}]},{"id":"proposed_bonus","requirement":"BR-17: Sum the company-adjusted bonus and both awards.","source":"pub fn proposed_bonus(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        PROPOSED,\u000a        sum(\u0026[\u000a            *i.get(COMPANY_BONUS)?,\u000a            *i.get(TENURE_AWARD)?,\u000a            *i.get(RETENTION_AWARD)?,\u000a        ])?,\u000a    )\u000a}","inputs":[{"name":"company_bonus_cents","type":"u64"},{"name":"tenure_award_cents","type":"u64"},{"name":"retention_award_cents","type":"u64"}],"outputs":[{"name":"proposed_bonus_cents","type":"u64"}]},{"id":"eligible_bonus","requirement":"BR-18: Ineligible employees receive a zero proposed payment.","source":"pub fn eligible_bonus(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        ELIGIBLE_AMOUNT,\u000a        if *i.get(ELIGIBLE)? {\u000a            *i.get(PROPOSED)?\u000a        } else {\u000a            0\u000a        },\u000a    )\u000a}","inputs":[{"name":"bonus_eligible","type":"bool"},{"name":"proposed_bonus_cents","type":"u64"}],"outputs":[{"name":"eligible_bonus_cents","type":"u64"}]},{"id":"capped_bonus","requirement":"BR-19: Cap the bonus at the employee-specific budget allocation.","source":"pub fn capped_bonus(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(CAPPED, (*i.get(ELIGIBLE_AMOUNT)?).min(*i.get(BUDGET)?))\u000a}","inputs":[{"name":"eligible_bonus_cents","type":"u64"},{"name":"employee_budget_cents","type":"u64"}],"outputs":[{"name":"capped_bonus_cents","type":"u64"}]},{"id":"finance_required","requirement":"BR-20: Finance approval is required above 200,000 cents, strictly.","source":"pub fn finance_required(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(FINANCE_REQUIRED, *i.get(CAPPED)? \u003e 200_000)\u000a}","inputs":[{"name":"capped_bonus_cents","type":"u64"}],"outputs":[{"name":"finance_required","type":"bool"}]},{"id":"approvals_satisfied","requirement":"BR-21: Require manager approval and finance approval when required.","source":"pub fn approvals_satisfied(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        APPROVALS,\u000a        *i.get(MANAGER_APPROVED)? \u0026\u0026 (!*i.get(FINANCE_REQUIRED)? || *i.get(FINANCE_APPROVED)?),\u000a    )\u000a}","inputs":[{"name":"manager_approved","type":"bool"},{"name":"finance_required","type":"bool"},{"name":"finance_approved","type":"bool"}],"outputs":[{"name":"approvals_satisfied","type":"bool"}]},{"id":"final_bonus","requirement":"BR-22: Emit the capped bonus if approvals pass, otherwise zero.","source":"pub fn final_bonus(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        FINAL,\u000a        if *i.get(APPROVALS)? {\u000a            *i.get(CAPPED)?\u000a        } else {\u000a            0\u000a        },\u000a    )\u000a}","inputs":[{"name":"approvals_satisfied","type":"bool"},{"name":"capped_bonus_cents","type":"u64"}],"outputs":[{"name":"final_bonus_cents","type":"u64"}]},{"id":"payment_ready","requirement":"BR-23: Emit a payment-ready fact only for a positive final bonus.","source":"pub fn payment_ready(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    let amount = *i.get(FINAL)?;\u000a    if amount \u003e 0 {\u000a        Facts::one(PAYMENT, amount)\u000a    } else {\u000a        Ok(Facts::new())\u000a    }\u000a}","inputs":[{"name":"final_bonus_cents","type":"u64"}],"outputs":[{"name":"payment_ready_cents","type":"u64"}]},{"id":"review_required","requirement":"BR-24: Emit approval_pending only for a positive bonus awaiting approval.","source":"pub fn review_required(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    if *i.get(CAPPED)? \u003e 0 \u0026\u0026 !*i.get(APPROVALS)? {\u000a        Facts::one(REVIEW, \"approval_pending\")\u000a    } else {\u000a        Ok(Facts::new())\u000a    }\u000a}","inputs":[{"name":"capped_bonus_cents","type":"u64"},{"name":"approvals_satisfied","type":"bool"}],"outputs":[{"name":"review_required","type":"\u0026str"}]},{"id":"total_compensation","requirement":"BR-25: Total compensation is annual salary plus the final bonus.","source":"pub fn total_compensation(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(TOTAL, sum(\u0026[*i.get(SALARY)?, *i.get(FINAL)?])?)\u000a}","inputs":[{"name":"salary_cents","type":"u64"},{"name":"final_bonus_cents","type":"u64"}],"outputs":[{"name":"total_compensation_cents","type":"u64"}]},{"id":"payment_reference","requirement":"BR-26: Derive a reference from employee ID and payment cents only when payment is ready.","source":"pub fn payment_reference(i: \u0026Inputs\u003c'_\u003e) -\u003e Result\u003cFacts, Error\u003e {\u000a    Facts::one(\u000a        REFERENCE,\u000a        format!(\"BONUS-{}-{}\", i.get(EMPLOYEE_ID)?, i.get(PAYMENT)?),\u000a    )\u000a}","inputs":[{"name":"employee_id","type":"\u0026str"},{"name":"payment_ready_cents","type":"u64"}],"outputs":[{"name":"payment_reference","type":"alloc::string::String"}]}],"edges":[{"from":2,"to":4,"fact":"tenure_eligible"},{"from":4,"to":5,"fact":"employment_eligible"},{"from":0,"to":5,"fact":"good_performance"},{"from":3,"to":5,"fact":"conduct_clear"},{"from":1,"to":9,"fact":"exceptional_performance"},{"from":6,"to":10,"fact":"role_rate_bps"},{"from":10,"to":11,"fact":"base_bonus_cents"},{"from":9,"to":11,"fact":"performance_factor_bps"},{"from":11,"to":12,"fact":"performance_bonus_cents"},{"from":7,"to":12,"fact":"department_factor_bps"},{"from":12,"to":13,"fact":"department_bonus_cents"},{"from":8,"to":13,"fact":"company_factor_bps"},{"from":0,"to":15,"fact":"good_performance"},{"from":13,"to":16,"fact":"company_bonus_cents"},{"from":14,"to":16,"fact":"tenure_award_cents"},{"from":15,"to":16,"fact":"retention_award_cents"},{"from":5,"to":17,"fact":"bonus_e
