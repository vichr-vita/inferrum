name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all --check
      - run: cargo nextest run --locked --workspace --profile ci --no-default-features
      - run: cargo nextest run --locked --workspace --profile ci --all-features
      # Nextest does not run doctests or Criterion's custom benchmark harness.
      - run: cargo test --locked --workspace --all-features --doc
      - run: cargo bench --locked --all-features --bench engine -- --test
      - run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - run: cargo run --locked --example bonus --features visualization

  go-ffi:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: ffi/go/go.sum
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - if: runner.os == 'macOS'
        run: brew install protobuf
      - run: sh ffi/generate-go.sh
      # System protoc versions differ; only their generated version comment may differ.
      - run: git diff --exit-code --ignore-matching-lines='^//[[:space:]]*protoc[[:space:]]' -- ffi/go/bonusv1/bonus.pb.go
      - run: cargo build --locked -p inferrum-ffi --release
      - run: go vet ./...
        working-directory: ffi/go
      # Go's cache does not track changes to the linked Rust archive.
      - run: go test -race -a ./...
        working-directory: ffi/go
        env:
          GOEXPERIMENT: cgocheck2

  visualization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check:viewer
      - run: cargo run --example bonus --features visualization
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
