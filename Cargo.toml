[package]
name = "inferrum"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A typed DAG decision engine that derives new facts"
license = "Apache-2.0"
repository = "https://github.com/vichr-vita/inferrum"
readme = "README.md"
publish = false

[workspace]
members = ["ffi"]
default-members = ["."]
resolver = "3"

[features]
default = []
visualization = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support", "plotters", "html_reports"] }

[[bench]]
name = "engine"
harness = false

[[example]]
name = "bonus"
required-features = ["visualization"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
